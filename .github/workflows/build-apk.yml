# Builds the Android app on GitHub's servers every push.
# Download the APK from: Actions tab -> latest run -> Artifacts.
# Push a tag like v1.0 to also publish it on the Releases page.
name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core self-test (scrubber on a generated video)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          bash tools/selftest.sh

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SG_KEYSTORE_PASS: ${{ secrets.SG_KEYSTORE_PASS }}
          SG_KEY_ALIAS: ${{ secrets.SG_KEY_ALIAS }}
          SG_KEY_PASS: ${{ secrets.SG_KEY_PASS }}
        run: |
          chmod +x gradlew
          mkdir -p out
          if [ -n "$SG_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk out/ScrubgnomeAFH.apk
          else
            echo "No signing secrets: building a debug APK instead"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/ScrubgnomeAFH-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ScrubgnomeAFH-apk
          path: out/*.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
